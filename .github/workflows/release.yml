name: Build & Release

# Triggers on any tag matching v* (e.g. v1.0.0, v1.0.15)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-and-release:
    name: Build Windows x64 and publish release
    runs-on: windows-latest   # must be Windows to compile better-sqlite3 for the Electron ABI and build the NSIS installer

    steps:
      # ── 1. Checkout full history so the tag commit is available ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Run test suite ─────────────────────────────────────────────────────
      # Runs against the plain npm-installed better-sqlite3 build (host Node
      # ABI), before any Electron-ABI rebuild happens below.
      - name: Run tests
        run: npx vitest run

      - name: Type check and dependency audit
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm audit --audit-level=low

      # ── 5. Build renderer + Electron main/preload ─────────────────────────────
      - name: Build
        run: npm run build

      # ── 6. Refresh the vendored prebuilt better-sqlite3 binary ────────────────
      # This repo's electron-builder config sets npmRebuild: false and its
      # afterPack.js hook copies prebuilt-win32-x64/better_sqlite3.node into the
      # packaged app instead of letting electron-builder rebuild it. That vendored
      # file was previously built for Electron ABI 145 (Electron 41) and is now
      # stale for Electron 43.4.0 (ABI 148). better-sqlite3's official prebuilds
      # only cover up to ABI 146 (Electron 42), so we compile it fresh here on a
      # real Windows runner and overwrite the vendored copy before packaging.
      # Done after tests above, which ran against the host-ABI build instead.
      - name: Rebuild better-sqlite3 for Electron and refresh vendored binary
        shell: bash
        run: |
          npx electron-rebuild -f -w better-sqlite3
          mkdir -p prebuilt-win32-x64
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node prebuilt-win32-x64/better_sqlite3.node
          echo "Refreshed prebuilt-win32-x64/better_sqlite3.node for Electron 43 (ABI 148)"

      - name: Prepare release-specific self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Ann Dunkin, O=Dunkin Global Advisors, OU=Software, C=US" -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(3)
          $password = [guid]::NewGuid().ToString()
          Write-Output "::add-mask::$password"
          $pfx = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "build/release-signing.cer" | Out-Null
          # Trust only on this disposable test runner so Windows can verify
          # integrity. Users' trust stores are never changed by the installer.
          Import-Certificate -FilePath "build/release-signing.cer" -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV

      # ── 7. Package with electron-builder (zip + nsis) ────────────────────────
      - name: Package Windows installers
        run: npx electron-builder --config electron-builder.config.js --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test signed installer, upgrade, runtime, reinstall, uninstall and repair
        shell: pwsh
        run: ./scripts/test-windows-release.ps1

      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence
          path: release-evidence/

      - name: Upload verified build for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-build
          compression-level: 0
          path: |
            dist-installer/*Setup*.exe
            dist-installer/*.zip
            build/release-signing.cer
            release-evidence/windows-validation.txt

      # ── 8. Extract version from tag (strips leading 'v') ─────────────────────
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 9. Locate build artifacts ─────────────────────────────────────────────
      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          ZIP=$(ls dist-installer/*.zip 2>/dev/null | head -1)
          EXE=$(ls dist-installer/*.exe 2>/dev/null | head -1)
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "EXE=$EXE" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: $ZIP"
          echo "Found EXE: $EXE"

      # ── 10. Extract release notes for this version from CHANGELOG.md ──────────
      - name: Extract release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## v$VERSION /{found=1; next} found && /^## v/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Credit Card Benefit Tracker v$VERSION"
          fi
          echo "$NOTES" > release_notes.txt
          cat release_notes.txt

      # ── 11. Create GitHub Release and upload assets ───────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Credit Card Benefit Tracker v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.ZIP }}
            ${{ steps.artifacts.outputs.EXE }}
            build/release-signing.cer
            release-evidence/windows-validation.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete temporary private signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:CSC_LINK -and (Test-Path $env:CSC_LINK)) { Remove-Item $env:CSC_LINK -Force }
